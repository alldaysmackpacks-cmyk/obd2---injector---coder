name: Build Demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-demo-apk.yml'
      - 'demo-apk/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build demo APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-injector-coder-demo-apk
          path: demo-apk/app/build/outputs/apk/debug/*.apk
